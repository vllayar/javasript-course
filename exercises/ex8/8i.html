<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>

<body>
  <button onclick="
    playGame('heads');
  ">Guess Heads</button>
  <button onclick="
    playGame('tails');
  ">Guess Tails</button>

  <script>
    let flipResult;
    function playGame(playerGuess) {
      flipCoin();

      playerGuess === flipResult ?
      alert(`You guessed it right! It's ${flipResult}`)
      : alert(`You guessed it wrong... It's actually ${flipResult}`)
    }

    function flipCoin() {
      flipResult = Math.random();
      flipResult < 1 / 2 ?
      flipResult = 'heads'
      : flipResult = 'tails'
    }
  </script>
</body>

</html>
