<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>

<body>
  <button onclick="
    playGame('heads');
  ">Guess Heads</button>
  <button onclick="
    playGame('tails');
  ">Guess Tails</button>
  <button onclick="
    resetScore();
  ">Reset Score</button>

  <script>
    let flipResult;
    let score = {
      wins: 0,
      losses: 0
    };

    function playGame(playerGuess) {
      flipCoin();

      if (playerGuess === flipResult) {
        score.wins++;
        alert(`You guessed it right! It's ${flipResult}\nWins: ${score.wins} | Losses: ${score.losses}`);
      } else {
        score.losses++;
        alert(`You guessed it wrong... It's actually ${flipResult}\nWins: ${score.wins} | Losses: ${score.losses}`);
      }
    }

    function flipCoin() {
      flipResult = Math.random();
      flipResult < 1 / 2 ?
      flipResult = 'heads'
      : flipResult = 'tails'
    }
  </script>
</body>

</html>
