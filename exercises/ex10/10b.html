<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML, CSS & JavaScript</title>
  <style>
    .request-button {
      background-color: black;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      margin-right: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .schedule-button {
      background-color: rgba(128, 128, 128, 0.244);
      color: black;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      margin-right: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button class="request-button">Request now</button>
  <button class="schedule-button">Schedule for later</button>
</body>

</html>
