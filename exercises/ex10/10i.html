<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: black;
      color: white;
      font-family: Arial;
      padding: 15px 8px;
    }

    .calculation-display {
      font-size: 45px;
      margin-bottom: 16px;
    }

    button {
      background-color: rgb(51, 51, 51);
      color: white;
      border: none;
      font-size: 26px;
      height: 60px;
      width: 60px;
      margin-right: 5px;
      margin-bottom: 16px;
      border-radius: 50%;
      cursor: pointer;
    }

    .operator-button {
      background-color: orange;
    }
  </style>
</head>

<body onkeydown="
  if (event.key === '1') {
    updateCalculation('1');
  } else if (event.key === '2'){
    updateCalculation('2');
  } else if (event.key === '3'){
    updateCalculation('3');
  } else if (event.key === '4'){
    updateCalculation('4');
  } else if (event.key === '5'){
    updateCalculation('5');
  } else if (event.key === '6'){
    updateCalculation('6');
  } else if (event.key === '7'){
    updateCalculation('7');
  } else if (event.key === '8'){
    updateCalculation('8');
  } else if (event.key === '9'){
    updateCalculation('9');
  } else if (event.key === '+'){
    updateCalculation(' + ');
  } else if (event.key === '-'){
    updateCalculation(' - ');
  } else if (event.key === '*'){
    updateCalculation(' * ');
  } else if (event.key === '/'){
    updateCalculation(' / ');
  } else if (event.key === '.'){
    updateCalculation('.');
  } else if (event.key === 'Enter'){
    calculation = eval(calculation);
      document.querySelector('.calculation-display').innerHTML = calculation;
      localStorage.setItem('calc', calculation);
  } else if (event.key === 'Backspace'){
    calculation = '0';
    localStorage.setItem('calc', calculation);
    document.querySelector('.calculation-display').innerHTML = calculation;
  }">
  <p class="calculation-display"></p>
  <p>
    <button class="button" onclick="
      updateCalculation('1');
    ">1</button>
    <button class="button" onclick="
      updateCalculation('2');
    ">2</button>
    <button class="button" onclick="
      updateCalculation('3');
    ">3</button>
    <button class="operator-button" onclick="
      updateCalculation(' + ');
    ">+</button>
  </p>
  <p>
    <button class="button" onclick="
      updateCalculation('4');
    ">4</button>
    <button class="button" onclick="
      updateCalculation('5');
    ">5</button>
    <button class="button" onclick="
      updateCalculation('6');
    ">6</button>
    <button class="operator-button" onclick="
      updateCalculation(' - ');
    ">-</button>
  </p>
  <p>
    <button class="button" onclick="
      updateCalculation('7');
    ">7</button>
    <button class="button" onclick="
      updateCalculation('8');
    ">8</button>
    <button class="button" onclick="
      updateCalculation('9');
    ">9</button>
    <button class="operator-button" onclick="
      updateCalculation(' * ');
    ">*</button>
  </p>
  <p>
    <button class="button" onclick="
      updateCalculation('0');
    ">0</button>
    <button class="button" onclick="
      updateCalculation('.');
    ">.</button>
    <button class="button" onclick="
      calculation = eval(calculation);
      document.querySelector('.calculation-display').innerHTML = calculation;
      localStorage.setItem('calc', calculation);
    ">=</button>
    <button class="operator-button" onclick="
      updateCalculation(' / ');
    ">/</button>
  </p>
  <p>
    <button class="button" style="font-size: 17px" onclick="
      calculation = '0';
      localStorage.setItem('calc', calculation);
      document.querySelector('.calculation-display').innerHTML = calculation;
    ">Clear</button>
  </p>

  <script>
    let calculation = localStorage.getItem('calc') || '0';
    document.querySelector('.calculation-display').innerHTML = calculation;

    function updateCalculation(update) {
      if (calculation === '0') { calculation = ''; }
      calculation += update;
      document.querySelector('.calculation-display').innerHTML = calculation;
      localStorage.setItem('calc', calculation);
    }
  </script>
</body>

</html>
