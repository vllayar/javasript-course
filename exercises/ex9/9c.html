<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
</head>

<body>
  <button onclick="
    displayChoice('heads');
  ">heads</button>
  <button onclick="
    displayChoice('tails');
  ">tails</button>
  <p class="choice-display"></p>

  <script>
    function displayChoice(choice) {
      document.querySelector('.choice-display').innerHTML = `You chose: ${choice}`;
    }
  </script>
</body>

</html>
